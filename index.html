<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ดาวน์โหลด Chat Buffalo</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }
        .card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 420px;
            width: 90%;
            animation: fadeIn 0.8s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo {
            width: 90px;
            height: 90px;
            margin-bottom: 20px;
            object-fit: contain;
            border-radius: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }
        h1 {
            font-size: 26px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 10px;
        }
        p {
            font-size: 15px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0062E6 0%, #33AEFF 100%);
            color: white;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(0, 98, 230, 0.3);
            transition: all 0.3s ease;
        }
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 98, 230, 0.4);
        }
        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- เปลี่ยนคำว่า logo.png เป็นชื่อไฟล์รูปโลโก้ของคุณที่อัปโหลดไว้ใน GitHub -->
        <img src="logo.png" alt="Chat Buffalo Logo" class="logo">
        
        <h1>Chat Buffalo</h1>
        <p>โปรแกรมช่วยพิมพ์ข้อความแชสด่วน ใช้งานง่าย สะดวก รวดเร็ว ปลอดภัย</p>
        
        <!-- เปลี่ยน Chat Buffalo.exe เป็นชื่อไฟล์โปรแกรมจริงของคุณ -->
        <a href="Chat Buffalo.exe" class="download-btn" download>
            📥 ดาวน์โหลดโปรแกรม (.exe)
        </a>

        <div class="footer">
            รองรับระบบปฏิบัติการ Windows
        </div>
    </div>

</body>
</html>
